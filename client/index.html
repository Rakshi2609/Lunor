<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#09090b" />
    <meta name="description" content="Danzo - Modern Productivity, Task Management & Treasury Workspace" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Danzo" />
    <title>Danzo - Modern Productivity Workspace</title>
    <script>
      // Capture PWA install prompt globally as early as possible
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('danzo:pwa-prompt-ready', { detail: e }));
      });
    </script>
    <!-- Premium Modern Typography: Geist, Geist Mono, Instrument Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Geist:wght@300;400;500;600;700;800;900&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="font-sans antialiased bg-white dark:bg-black text-black dark:text-white">
    <div id="root">
      <style>
        .preloader-wrapper {
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
          background: #ffffff;
          color: #09090b;
        }
        @media (prefers-color-scheme: dark) {
          .preloader-wrapper {
            background: #09090b;
            color: #fafafa;
          }
        }
        .preloader-badge {
          width: 72px;
          height: 72px;
          border-radius: 18px;
          background: rgba(120, 119, 198, 0.08);
          border: 1px solid rgba(120, 119, 198, 0.2);
          display: flex;
          align-items: center;
          justify-content: center;
          font-weight: 800;
          font-size: 28px;
          letter-spacing: -1px;
          margin-bottom: 20px;
          position: relative;
          animation: pulseBadge 2.2s infinite ease-in-out;
        }
        .preloader-bar-bg {
          width: 180px;
          height: 4px;
          background: rgba(120, 119, 198, 0.15);
          border-radius: 99px;
          overflow: hidden;
          position: relative;
        }
        .preloader-bar-fill {
          width: 50%;
          height: 100%;
          background: linear-gradient(90deg, #6366f1, #3b82f6);
          border-radius: 99px;
          animation: sweep 1.5s infinite ease-in-out;
        }
        @keyframes pulseBadge {
          0%, 100% { transform: scale(0.97); opacity: 0.9; }
          50% { transform: scale(1.03); opacity: 1; box-shadow: 0 0 30px rgba(99, 102, 241, 0.25); }
        }
        @keyframes sweep {
          0% { transform: translateX(-100%); }
          100% { transform: translateX(200%); }
        }
      </style>
      <div class="preloader-wrapper">
        <div class="preloader-badge">
          <span>D</span>
        </div>
        <div style="font-size: 15px; font-weight: 600; margin-bottom: 12px; letter-spacing: -0.01em;">Danzo Workspace</div>
        <div class="preloader-bar-bg">
          <div class="preloader-bar-fill"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
